<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2a55"/>
      <stop offset="50%" stop-color="#5b316c"/>
      <stop offset="100%" stop-color="#3c2546"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e0aa"/>
      <stop offset="50%" stop-color="#e2c878"/>
      <stop offset="100%" stop-color="#b68d50"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer rounded shield background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Gold border ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.9"/>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Inner frame -->
  <rect x="92" y="92" width="328" height="328" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.55"/>

  <!-- Decorative gold star/compass -->
  <g transform="translate(400,100)" filter="url(#softShadow)">
    <path d="m0 -22 5 14 15 4 -12 9 4 14 -11 -8 -11 8 4 -14 -12 -9 15 -4z" fill="url(#goldGrad)" stroke="#3c2546" stroke-width="1.5"/>
  </g>

  <!-- Main H letter -->
  <text x="256" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="264" fill="#ffffff">H</text>

  <!-- Gold accent line under H -->
  <path d="M180 400 H332" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
</svg>